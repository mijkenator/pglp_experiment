services:
  postgres:
    image: postgres:16-alpine
    container_name: pglp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pglp_dev
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    volumes:
      - pglp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pglp_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node RisingWave, for experimenting with consuming pglp_dev via
  # its built-in postgres-cdc connector (its own publication/slot,
  # independent of the Elixir Consumer's — Postgres allows multiple
  # replication slots on the same database, each with its own reader).
  #
  # Connect with: psql -h localhost -p 4566 -d dev -U root
  # See README for the CREATE SOURCE / CREATE TABLE ... FROM ... syntax.
  risingwave:
    image: risingwavelabs/risingwave:v3.1.0
    container_name: pglp_risingwave
    restart: unless-stopped
    command: ["single_node"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4566:4566"
      - "5691:5691"
    volumes:
      - pglp_rwdata:/root/.risingwave
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:5691/"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pglp_pgdata:
  pglp_rwdata:
